[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.20", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "r2ie"
version = "0.1.0"
description = "R2IE - Recursive Relativistic Information Engine: an experimental architecture combining VQ bottlenecks, adaptive per-token compute (ACT), and bounded fast-weight adaptation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abir Maheshwari" }]
keywords = ["deep-learning", "transformer", "vector-quantization", "adaptive-computation", "research"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.1.0"]
cpp = ["cmake>=3.20", "pybind11>=2.10"]

[project.scripts]
r2ie-train = "r2ie.train:main"
r2ie-generate = "r2ie.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
